<!DOCTYPE html>
<html>
    <head>
    <title>Launch Status</title>
    <script>
        // this script tag includes:
            // 1. a 'load' event handler 
            // 2. a 'fetch' and 'response handler function'
            // 3. a console.log that prints the response
        window.addEventListener("load", function() {
            fetch("https://handlers.education.launchcode.org/static/weather.json").then(function(response) {
                console.log(response);
                 // Access the JSON in the response
                response.json().then( function(json) { // .json() is an object of the Response class. .json() returns a new Response object for returning the provided JSON encoded data.
                console.log(json); //the JSON data we need
                
                //Now updae the DOM to display the resuls
                const div = document.getElementById("weather-conditions");
                // Add HTML that includes the JSON data
                div.innerHTML = `
                    <ul>
                        <li>Temp ${json.temp}</li>
                        <li>Wind Speed ${json.windSpeed}</li>
                        <li>Status ${json.status}</li>
                        <li>Chance of Precip ${json.chanceOfPrecipitation}</li>
                    </ul>
                `;
                });
            });
        });
    </script>
    </head>
    <body>
    <h1>Launch Status</h1>
    <h3>Weather Conditions</h3>
    <div id="weather-conditions">
        <!-- TODO: dynamically add html about weather using data from API -->
    </div>
    </body>
</html>
